name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Redirect turbo's remote-cache noise off unless/until a real token is
  # configured as a repo secret (build plan §7).
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) — gitleaks-action diffs a commit range
      # (`<parent-of-first-new-commit>..<head>`) to scan only what a push
      # actually introduced. actions/checkout@v4's default fetch-depth: 1
      # (shallow clone) means that parent commit doesn't exist locally, so
      # git's range syntax fails with "unknown revision", gitleaks reports
      # "failed to scan Git repository", and the action exits non-zero even
      # with zero real findings. Found via a live CI failure, not by
      # inspection — the shallow-clone default is easy to miss since gitleaks
      # runs and produces (empty, correct) output right up until this error.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version:` here — pnpm/action-setup@v4 reads it from package.json's
      # `packageManager` field. Passing both errors with ERR_PNPM_BAD_PM_VERSION
      # ("Multiple versions of pnpm specified") — found via a live CI failure,
      # not by inspection.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests (core-crypto known-answer tests + core-domain)
        run: pnpm turbo run test

      - name: Build web
        run: pnpm --filter @password-manager/web build

      - name: Build browser extension
        run: pnpm --filter @password-manager/browser-extension build

  supabase-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations)
        run: supabase start

      - name: Run pgTAP RLS regression suite
        run: supabase test db
        # Blocking gate per build plan §7/§8 — every table must deny
        # cross-user access. See supabase/tests/db/001-rls.sql; the scenarios
        # it encodes were separately hand-verified against a live Postgres
        # instance while each migration was written (see that file's header).
